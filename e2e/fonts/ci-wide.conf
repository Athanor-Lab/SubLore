<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  The runner's type on this machine.

  Every width in the shell is a width the machine's fonts decide, and this repository's runner and
  the CI runner do not agree: the same row of controls is about a tenth wider under DejaVu Sans,
  which is what the CI image resolves `system-ui` to, than under the families this interface was
  drawn against. Three defects were invisible here and red there because of it (N132, N134).

  Point a run at this file to see what the runner sees:

      FONTCONFIG_FILE=$PWD/e2e/fonts/ci-wide.conf \
        xvfb-run -a -s "-screen 0 1920x1080x24" pnpm e2e

  A double hyphen cannot appear in an XML comment, so the spec filter is not written out here: pass
  it the way e2e/README.md does. Fontconfig refuses the whole file over it and falls back silently
  to the system fonts, which reads as a run that proved something and did not.

  It is not what the battery runs: the suite runs against the machine it is on, and this is the
  instrument for reproducing the other one.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="pattern">
    <test name="family"><string>system-ui</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Sans</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Cantarell</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
</fontconfig>
